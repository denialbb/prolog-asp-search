name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint and Cyclomatic Complexity Check
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Report the average complexity for visibility. The hard threshold is
          # enforced per function by tests/test_complexity.py, because radon
          # has no option to fail on a minimum average rank.
          radon cc -s -a -nb tests/ $(test -d asp && echo asp) $(test -d prolog && echo prolog)

      - name: Run Prolog plunit tests
        run: |
          swipl -g run_tests -t halt tests/test_labyrinth.pl
          swipl -g run_tests -t halt tests/test_puzzle8.pl

      - name: Run Python and ASP test suite
        run: |
          pytest -v tests/
